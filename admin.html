<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFNAT Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">
  <div class="brand">
    <div class="logo-mark">S</div>
    <div>
      <strong>SAFNAT</strong>
      <small>Admin Panel</small>
    </div>
  </div>

  <a href="index.html" class="admin-back">← View Website</a>
</header>

<main class="admin-page">

  <section class="admin-hero">
    <h1>SAFNAT Admin Panel</h1>
    <p>Manage your products, prices, offers and branches.</p>
  </section>

  <section class="admin-card">
    <h2>➕ Add Product</h2>

    <div class="admin-form">

      <input id="productName" type="text" placeholder="Product name">

      <select id="productCategory">
        <option value="Grocery">Grocery</option>
        <option value="Fresh Food">Fresh Food</option>
        <option value="Beverages">Beverages</option>
        <option value="Snacks">Snacks</option>
        <option value="Household">Household</option>
        <option value="Personal Care">Personal Care</option>
      </select>

      <input id="productPrice" type="number" step="0.001" placeholder="Price (OMR)">

      <input id="productOldPrice" type="number" step="0.001" placeholder="Old price (optional)">

      <input id="productIcon" type="text" placeholder="Emoji / icon e.g. 🍎">

      <label class="admin-check">
        <input id="productOffer" type="checkbox">
        Special Offer
      </label>

      <label class="admin-check">
        <input id="productStock" type="checkbox" checked>
        In Stock
      </label>

      <button class="admin-btn" onclick="addProduct()">
        Add Product
      </button>

    </div>
  </section>

  <section class="admin-card">
    <div class="admin-title-row">
      <div>
        <h2>📦 Products</h2>
        <p>Edit or remove products.</p>
      </div>

      <button class="admin-btn secondary" onclick="resetAdminProducts()">
        Reset Demo Products
      </button>
    </div>

    <div id="adminProductList" class="admin-product-list"></div>
  </section>

</main>

<div id="adminToast" class="toast"></div>

<script src="admin.js"></script>

</body>
</html>
